<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - Admin & Menü Yönetimi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full bg-slate-900 p-4">

  <!-- GİRİŞ EKRANI -->
  <div id="login-screen" class="max-w-md mx-auto mt-16 bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center space-y-4">
    <div class="w-16 h-16 bg-red-600/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto text-2xl font-black">🔐</div>
    <h2 class="text-xl font-black">Garson / Admin Girişi</h2>
    <p class="text-xs text-slate-400">Yönetim ve Menü Paneli</p>
    
    <input type="text" id="user-input" value="Evrekap Pizza" placeholder="Kullanıcı Adı" class="w-full text-center bg-slate-900 border border-slate-700 rounded-2xl py-3 text-sm font-bold text-white focus:outline-none focus:ring-2 focus:ring-red-500">
    <input type="password" id="pass-input" placeholder="Şifreniz (Varsayılan: 1234)" class="w-full text-center bg-slate-900 border border-slate-700 rounded-2xl py-3 text-sm font-bold text-white focus:outline-none focus:ring-2 focus:ring-red-500">
    
    <button onclick="loginServer()" class="w-full bg-red-600 hover:bg-red-700 text-white font-extrabold py-3 rounded-2xl text-xs transition">Giriş Yap</button>
  </div>

  <!-- ANA DASHBOARD -->
  <div id="dashboard" class="max-w-6xl mx-auto hidden space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
      <div>
        <h1 class="text-xl font-black flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span> Evreka Pizza Yönetim Paneli</h1>
        <p class="text-xs text-slate-400 mt-0.5">Canlı Sipariş Takibi & Menü/Fiyat Yönetimi</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="switchMainTab('orders')" id="tab-btn-orders" class="bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-extrabold transition">Sipariş & POS</button>
        <button onclick="switchMainTab('menu')" id="tab-btn-menu" class="bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl font-bold transition">Menü & Ürün Yönetimi</button>
        <button onclick="logout()" class="bg-red-600/20 text-red-400 hover:bg-red-600 text-xs px-3 py-2 rounded-xl font-bold">Çıkış</button>
      </div>
    </div>

    <!-- SİPARİŞLER SEKMESİ -->
    <div id="section-orders" class="space-y-5">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700"><span class="text-slate-400 font-bold block mb-1">Toplam Ciro</span><span class="text-lg font-black text-emerald-400" id="stat-ciro">0 ₺</span></div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700"><span class="text-slate-400 font-bold block mb-1">Onay Bekleyen</span><span class="text-lg font-black text-amber-400" id="stat-bekleyen">0</span></div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700"><span class="text-slate-400 font-bold block mb-1">Mutfakta</span><span class="text-lg font-black text-emerald-400" id="stat-mutfakta">0</span></div>
        <div class="bg-slate-800 p-3.5 rounded-2xl border border-slate-700"><span class="text-slate-400 font-bold block mb-1">Ödeme Bekleyen</span><span class="text-lg font-black text-indigo-400" id="stat-servis">0</span></div>
      </div>
      <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
        <button onclick="setFilter('ALL')" id="filter-ALL" class="px-4 py-2 rounded-xl font-extrabold bg-red-600 text-white transition">Aktif Siparişler</button>
        <button onclick="setFilter('WAITING')" id="filter-WAITING" class="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700 transition">Yeni Gelenler</button>
        <button onclick="setFilter('PREPARING')" id="filter-PREPARING" class="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700 transition">Mutfakta</button>
        <button onclick="setFilter('SERVED')" id="filter-SERVED" class="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700 transition">Ödeme Bekleyenler</button>
        <button onclick="setFilter('PAID')" id="filter-PAID" class="px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700 transition">Tamamlananlar</button>
      </div>
      <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- MENÜ YÖNETİMİ SEKMESİ -->
    <div id="section-menu" class="hidden space-y-6">
      <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-4">
        <h3 class="text-base font-black text-white flex items-center gap-2"><i class="fa-solid fa-plus-circle text-red-500"></i> Yeni Ürün Ekle</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 text-xs">
          <input type="text" id="new-title" placeholder="Ürün Adı" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
          <select id="new-category" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
            <option value="pizza">Pizza</option><option value="burger">Burger</option><option value="salad">Salata</option><option value="side">Atıştırmalık</option><option value="beverage">İçecek</option><option value="dessert">Tatlı</option>
          </select>
          <input type="number" id="new-price" placeholder="Fiyat (₺)" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
          <input type="text" id="new-image" placeholder="Görsel URL" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white">
        </div>
        <textarea id="new-desc" placeholder="Ürün Açıklaması..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white"></textarea>
        <button onclick="addNewProduct()" class="bg-red-600 hover:bg-red-700 text-white font-extrabold text-xs px-6 py-3 rounded-xl transition shadow-lg">Ürünü Menüye Ekle</button>
      </div>
      <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl space-y-4">
        <h3 class="text-base font-black text-white flex items-center gap-2"><i class="fa-solid fa-utensils text-amber-400"></i> Menüdeki Ürünler ve Fiyatlar</h3>
        <div id="admin-menu-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </div>
  </div>

  <!-- ÖDEME MODALI -->
  <div id="payment-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <div><h3 class="text-lg font-black text-white" id="pay-modal-table">Masa - Ödeme Al</h3><p class="text-xs text-slate-400" id="pay-modal-id">Sipariş #000</p></div>
        <button onclick="closePaymentModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 text-center"><span class="text-xs text-slate-400 font-bold uppercase block">Tahsil Edilecek Tutar</span><span class="text-3xl font-black text-emerald-400 mt-1 block" id="pay-modal-amount">0 ₺</span></div>
      <button id="confirm-pay-btn" onclick="processPayment()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-3.5 rounded-2xl text-xs shadow-lg transition">Ödemeyi Onayla ve Masayı Kapat</button>
    </div>
  </div>

  <script>
    let currentFilter = 'ALL';
    let cachedOrders = [];
    let cachedCatalog = [];
    let selectedOrderForPay = null;
    let localStatusOverrides = JSON.parse(localStorage.getItem('evreka_order_statuses') || '{}');

    async function loginServer() {
      const username = document.getElementById('user-input').value.trim();
      const password = document.getElementById('pass-input').value.trim();
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await res.json();
        if (data.success) {
          document.getElementById('login-screen').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          fetchData();
          setInterval(fetchData, 2000);
        } else { alert(data.error || 'Giriş Başarısız!'); }
      } catch (err) { alert('Sunucuya bağlanılamadı.'); }
    }

    function logout() { location.reload(); }

    function switchMainTab(tab) {
      if (tab === 'orders') {
        document.getElementById('section-orders').classList.remove('hidden');
        document.getElementById('section-menu').classList.add('hidden');
        document.getElementById('tab-btn-orders').className = "bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-extrabold transition";
        document.getElementById('tab-btn-menu').className = "bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl font-bold transition";
      } else {
        document.getElementById('section-orders').classList.add('hidden');
        document.getElementById('section-menu').classList.remove('hidden');
        document.getElementById('tab-btn-menu').className = "bg-red-600 text-white text-xs px-4 py-2 rounded-xl font-extrabold transition";
        document.getElementById('tab-btn-orders').className = "bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs px-4 py-2 rounded-xl font-bold transition";
        fetchCatalogForAdmin();
      }
    }

    async function fetchData() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success) {
          cachedOrders = (data.orders || []).map(o => ({ ...o, status: String(localStatusOverrides[o.id] || o.status || 'WAITING').toUpperCase().trim() }));
          updateCounts();
          renderOrders();
        }
      } catch (err) {}
    }

    async function fetchCatalogForAdmin() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        if (data.success) { cachedCatalog = data.catalog || []; renderAdminCatalog(); }
      } catch (e) {}
    }

    function renderAdminCatalog() {
      const container = document.getElementById('admin-menu-list');
      container.innerHTML = cachedCatalog.map(item => `
        <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-700 flex items-center justify-between gap-3 text-xs">
          <div class="flex items-center gap-3">
            <img src="${item.image}" class="w-12 h-12 rounded-xl object-cover">
            <div><h4 class="font-extrabold text-white">${item.title}</h4><span class="text-[10px] text-slate-400 uppercase">${item.category}</span></div>
          </div>
          <div class="flex items-center gap-2">
            <input type="number" id="price-input-${item.id}" value="${item.basePrice}" class="w-20 bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-amber-400 font-bold text-center">
            <button onclick="updatePrice('${item.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-xl font-bold"><i class="fa-solid fa-check"></i></button>
            <button onclick="deleteProduct('${item.id}')" class="bg-slate-800 hover:bg-red-600/30 text-slate-400 hover:text-red-400 px-2.5 py-1.5 rounded-xl"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    async function addNewProduct() {
      const title = document.getElementById('new-title').value.trim();
      const category = document.getElementById('new-category').value;
      const basePrice = document.getElementById('new-price').value;
      const description = document.getElementById('new-desc').value.trim();
      const image = document.getElementById('new-image').value.trim();
      if (!title || !basePrice) { alert('Lütfen ürün adı ve fiyatı giriniz.'); return; }
      try {
        const res = await fetch('/api/catalog', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title, category, basePrice, description, image }) });
        const data = await res.json();
        if (data.success) {
          document.getElementById('new-title').value = ''; document.getElementById('new-price').value = ''; document.getElementById('new-desc').value = ''; document.getElementById('new-image').value = '';
          fetchCatalogForAdmin(); alert('Ürün eklendi!');
        }
      } catch (e) {}
    }

    async function updatePrice(id) {
      const newPrice = document.getElementById(`price-input-${id}`).value;
      try {
        await fetch(`/api/catalog/${id}/price`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ basePrice: newPrice }) });
        alert('Fiyat güncellendi!'); fetchCatalogForAdmin();
      } catch (e) {}
    }

    async function deleteProduct(id) {
      if (!confirm('Silinsin mi?')) return;
      try { await fetch(`/api/catalog/${id}`, { method: 'DELETE' }); fetchCatalogForAdmin(); } catch (e) {}
    }

    function updateCounts() {
      document.getElementById('stat-ciro').innerText = `${cachedOrders.filter(o => o.status === 'PAID').reduce((s,o)=>s+Number(o.totalPrice),0)} ₺`;
      document.getElementById('stat-bekleyen').innerText = cachedOrders.filter(o => o.status === 'WAITING' || o.status === 'WAITING_WAITER' || !o.status).length;
      document.getElementById('stat-mutfakta').innerText = cachedOrders.filter(o => o.status === 'PREPARING').length;
      document.getElementById('stat-servis').innerText = cachedOrders.filter(o => o.status === 'SERVED' || o.status === 'SERVICED' || o.status === 'DELIVERED').length;
    }

    function setFilter(f) {
      currentFilter = f;
      // Sekme ışıklandırma mantığı
      ['ALL', 'WAITING', 'PREPARING', 'SERVED', 'PAID'].forEach(key => {
        const btn = document.getElementById(`filter-${key}`);
        if (btn) {
          if (key === f) {
            btn.className = "px-4 py-2 rounded-xl font-extrabold bg-red-600 text-white transition shadow-md";
          } else {
            btn.className = "px-4 py-2 rounded-xl font-bold bg-slate-800 text-slate-300 border border-slate-700 transition";
          }
        }
      });
      renderOrders();
    }

    async function updateOrderStatus(id, newStatus) {
      localStatusOverrides[id] = newStatus;
      localStorage.setItem('evreka_order_statuses', JSON.stringify(localStatusOverrides));
      fetchData();
      try {
        if (newStatus === 'PREPARING') await fetch(`/api/orders/${id}/approve`, { method: 'PATCH' });
        else await fetch(`/api/orders/${id}/status`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: newStatus }) });
      } catch (e) {}
    }

    function openPaymentModal(orderId) {
      selectedOrderForPay = cachedOrders.find(o => String(o.id) === String(orderId));
      if (!selectedOrderForPay) return;
      document.getElementById('pay-modal-table').innerText = `${selectedOrderForPay.tableName} - Ödeme Al`;
      document.getElementById('pay-modal-amount').innerText = `${selectedOrderForPay.totalPrice} ₺`;
      document.getElementById('payment-modal').classList.remove('hidden');
    }
    function closePaymentModal() { document.getElementById('payment-modal').classList.add('hidden'); }
    async function processPayment() { await updateOrderStatus(selectedOrderForPay.id, 'PAID'); closePaymentModal(); }
    async function cancelOrder(id) {
      if (!confirm('İptal edilsin mi?')) return;
      localStatusOverrides[id] = 'CANCELLED';
      localStorage.setItem('evreka_order_statuses', JSON.stringify(localStatusOverrides));
      fetchData();
    }

    function renderOrders() {
      const container = document.getElementById('orders-container');
      let filtered = cachedOrders;
      if (currentFilter === 'WAITING') filtered = cachedOrders.filter(o => o.status === 'WAITING' || o.status === 'WAITING_WAITER' || !o.status);
      else if (currentFilter === 'PREPARING') filtered = cachedOrders.filter(o => o.status === 'PREPARING');
      else if (currentFilter === 'SERVED') filtered = cachedOrders.filter(o => o.status === 'SERVED' || o.status === 'SERVICED' || o.status === 'DELIVERED');
      else if (currentFilter === 'PAID') filtered = cachedOrders.filter(o => o.status === 'PAID');
      else filtered = cachedOrders.filter(o => o.status !== 'CANCELLED');

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-full p-12 text-center text-slate-500 text-xs bg-slate-800/40 rounded-3xl border border-slate-800">Sipariş bulunamadı.</div>';
        return;
      }

      container.innerHTML = [...filtered].reverse().map(o => {
        let statusBadge = '';
        let action = '';

        if (o.status === 'PREPARING') {
          statusBadge = '<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-lg text-[10px] font-black">Mutfakta</span>';
          action = `<button onclick="updateOrderStatus('${o.id}', 'SERVED')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-xs py-2.5 rounded-xl shadow">Hazır / Servis Et</button>`;
        } else if (o.status === 'SERVED' || o.status === 'SERVICED' || o.status === 'DELIVERED') {
          statusBadge = '<span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2.5 py-1 rounded-lg text-[10px] font-black">Masada / Ödeme Bekliyor</span>';
          action = `<button onclick="openPaymentModal('${o.id}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold text-xs py-2.5 rounded-xl shadow">Ödeme Al (POS)</button>`;
        } else if (o.status === 'PAID') {
          statusBadge = '<span class="bg-slate-700 text-slate-300 border border-slate-600 px-2.5 py-1 rounded-lg text-[10px] font-black">Tamamlandı</span>';
          action = `<div class="text-center text-xs text-slate-500 font-bold">Kapandı ✅</div>`;
        } else if (o.status === 'CANCELLED') {
          statusBadge = '<span class="bg-slate-700 text-slate-400 border border-slate-600 px-2.5 py-1 rounded-lg text-[10px] font-black">İptal Edildi</span>';
          action = `<div class="text-center text-xs text-slate-500 font-bold">İptal ❌</div>`;
        } else {
          statusBadge = '<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2.5 py-1 rounded-lg text-[10px] font-black">Onay Bekliyor</span>';
          action = `<div class="grid grid-cols-2 gap-2"><button onclick="updateOrderStatus('${o.id}', 'PREPARING')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs py-2.5 rounded-xl shadow">Onay (Mutfağa)</button><button onclick="cancelOrder('${o.id}')" class="bg-slate-700 hover:bg-red-600/30 text-slate-300 font-bold text-xs py-2.5 rounded-xl">İptal</button></div>`;
        }

        return `
          <div class="bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-xl flex flex-col justify-between gap-4">
            <div>
              <div class="flex justify-between items-center border-b border-slate-700 pb-3 mb-3">
                <span class="bg-red-600 text-white font-black text-xs px-3 py-1 rounded-xl">${o.tableName}</span>
                <span class="text-xs font-mono text-slate-400">#${o.id}</span>
              </div>
              <div class="space-y-2">${(o.items||[]).map(i=>`<div class="bg-slate-900 p-2.5 rounded-xl text-xs flex justify-between items-center"><span>${i.title}${i.size?`(${i.size})`:''}</span><b class="text-white">${i.price} ₺</b></div>`).join('')}</div>
            </div>
            <div class="border-t border-slate-700 pt-3 flex flex-col gap-3">
              <div class="flex justify-between items-center">
                ${statusBadge}
                <div class="text-right"><span class="text-[10px] text-slate-400 block uppercase font-bold">Toplam</span><span class="text-lg font-black text-amber-400">${o.totalPrice} ₺</span></div>
              </div>
              ${action}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
