<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - QR Menü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .cart-drawer, .tracker-drawer { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); transform: translateY(100%); }
    .cart-drawer.active, .tracker-drawer.active { transform: translateY(0); }
  </style>
</head>
<body class="h-full text-slate-800 bg-slate-100 flex flex-col antialiased">

  <div id="no-table-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4 text-center hidden">
    <div class="max-w-sm bg-slate-900 border border-slate-800 p-8 rounded-3xl space-y-4 shadow-2xl">
      <div class="w-16 h-16 bg-red-600/20 text-red-500 rounded-2xl flex items-center justify-center mx-auto text-3xl font-black border border-red-500/30"><i class="fa-solid fa-qrcode"></i></div>
      <h2 class="text-xl font-black text-white">Masa Bilgisi Bulunamadı</h2>
      <p class="text-xs text-slate-400">Lütfen masanızdaki QR kodu okutun (Örn: <code class="text-amber-300">?masa=Masa-1</code>).</p>
    </div>
  </div>

  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-xl border-b border-slate-800">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 via-red-600 to-red-700 flex items-center justify-center text-white text-xl">🍕</div>
        <div><h1 class="font-black text-base text-white leading-none">EVREKA PIZZA</h1><p class="text-[11px] text-amber-400 font-semibold mt-0.5">Gurme Taş Fırın</p></div>
      </div>
      <div id="table-display-badge" class="bg-emerald-600/20 text-emerald-400 font-extrabold text-xs px-3.5 py-2 rounded-2xl border border-emerald-500/40 flex items-center gap-2">
        <i class="fa-solid fa-lock text-[10px]"></i><span id="active-table-display">Yükleniyor...</span>
      </div>
    </div>
  </header>

  <div id="mini-tracker-banner" class="hidden bg-slate-900 border-b border-slate-800 px-4 py-2.5 sticky top-[57px] z-30">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span><span class="text-slate-200 font-bold" id="mini-tracker-text">Aktif Siparişiniz Var</span></div>
      <button onclick="toggleTrackerDrawer()" class="bg-gradient-to-r from-amber-500 to-red-600 text-white font-extrabold text-[11px] px-3.5 py-1.5 rounded-xl">Canlı Takip Et ➔</button>
    </div>
  </div>

  <main class="flex-1 max-w-xl w-full mx-auto pb-28">
    <div class="p-4">
      <div class="bg-gradient-to-r from-red-600 via-amber-600 to-orange-600 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
        <h2 class="text-2xl font-black leading-tight">İtalyan Usulü Taş Fırın</h2>
        <p class="text-xs text-white/80 mt-1">Anında sipariş verin, masanızda takip edin.</p>
      </div>
    </div>

    <div class="px-4 overflow-x-auto no-scrollbar flex gap-2 py-1 sticky top-[65px] z-20 bg-slate-100/90 backdrop-blur-md">
      <button onclick="filterCategory('all', this)" class="cat-btn px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-black shadow-sm whitespace-nowrap">Tüm Menü</button>
      <button onclick="filterCategory('pizza', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">Pizzalar</button>
      <button onclick="filterCategory('burger', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">Burgerler</button>
      <button onclick="filterCategory('salad', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">Salatalar</button>
      <button onclick="filterCategory('side', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">Atıştırmalıklar</button>
      <button onclick="filterCategory('beverage', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">İçecekler</button>
      <button onclick="filterCategory('dessert', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap">Tatlılar</button>
    </div>

    <div class="px-4 mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4" id="product-list"></div>
  </main>

  <div id="cart-bar" class="fixed bottom-0 left-0 right-0 z-40 p-4 bg-gradient-to-t from-slate-100 via-slate-100/90 to-transparent">
    <div class="max-w-xl mx-auto">
      <button onclick="toggleCartDrawer()" class="w-full bg-gradient-to-r from-red-600 to-amber-600 text-white font-extrabold py-3.5 px-6 rounded-2xl shadow-xl flex items-center justify-between">
        <div class="flex items-center gap-3"><span id="cart-badge" class="bg-white text-red-600 w-7 h-7 rounded-full flex items-center justify-center text-xs font-black">0</span><span>Sepeti İncele & Gönder</span></div>
        <span id="cart-total-price" class="text-base font-black">0 ₺</span>
      </button>
    </div>
  </div>

  <div id="drawer-overlay" onclick="closeCartDrawerExplicit()" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden"></div>
  <div id="cart-drawer" class="cart-drawer fixed bottom-0 right-0 left-0 sm:left-auto sm:top-0 sm:w-96 bg-white z-50 rounded-t-3xl sm:rounded-l-3xl max-h-[85vh] flex flex-col shadow-2xl">
    <div class="p-5 border-b flex justify-between items-center bg-slate-50 rounded-t-3xl">
      <div><h3 class="text-lg font-black text-slate-900">Sipariş Özetiniz</h3><p class="text-xs text-emerald-600 font-extrabold" id="cart-drawer-table-display">Masa</p></div>
      <button onclick="closeCartDrawerExplicit()" class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cart-items-container" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
    <div class="p-5 border-t bg-slate-50 space-y-3">
      <div class="flex justify-between items-center text-sm"><span class="text-slate-500 font-bold">Toplam:</span><span id="cart-drawer-total" class="text-2xl font-black text-red-600">0 ₺</span></div>
      <button id="submit-btn" onclick="submitOrderToAPI()" class="w-full bg-red-600 text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-lg">Garsona Siparişi Gönder</button>
    </div>
  </div>

  <div id="tracker-overlay" onclick="closeTrackerDrawer()" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 hidden"></div>
  <div id="tracker-drawer" class="tracker-drawer fixed bottom-0 right-0 left-0 bg-slate-900 text-white z-50 rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
    <div class="p-5 border-b border-slate-800 flex justify-between items-center"><h3 class="text-lg font-black">Canlı Sipariş Takibi</h3><button onclick="closeTrackerDrawer()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button></div>
    <div id="tracker-items-container" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
  </div>

  <div id="order-success-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-5">
      <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center mx-auto text-3xl"><i class="fa-solid fa-check"></i></div>
      <h3 class="text-xl font-black text-white">Siparişiniz Alındı!</h3>
      <button onclick="document.getElementById('order-success-modal').classList.add('hidden'); toggleTrackerDrawer();" class="w-full bg-emerald-600 text-white font-extrabold py-3 rounded-2xl text-xs">Canlı Takibi Aç</button>
    </div>
  </div>

  <div id="options-modal" class="fixed inset-0 z-50 bg-slate-950/75 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[90vh] overflow-y-auto p-6 shadow-2xl flex flex-col">
      <div class="relative h-48 -mx-6 -mt-6 mb-4 overflow-hidden rounded-t-3xl bg-slate-100">
        <img id="modal-img" src="" class="w-full h-full object-cover">
        <button onclick="closeOptionsModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/50 text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <h3 id="modal-title" class="text-xl font-black text-slate-900"></h3>
      <p id="modal-desc" class="text-xs text-slate-500 mt-1"></p>

      <div class="mt-5" id="size-section">
        <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">Boyut Seçin *</label>
        <div class="grid grid-cols-2 gap-2" id="modal-sizes"></div>
      </div>

      <div class="mt-5">
        <label class="block text-xs font-extrabold text-slate-700 uppercase mb-1">Garson Notu</label>
        <input type="text" id="modal-note" placeholder="Örn: Sosu bol olsun..." class="w-full bg-slate-50 border rounded-xl px-3 py-2 text-xs">
      </div>

      <div class="mt-6 pt-3 border-t">
        <button id="modal-add-btn" class="w-full bg-slate-900 text-white font-extrabold py-3.5 rounded-2xl text-sm flex justify-between px-6">
          <span>Sepete Ekle</span><span id="modal-total-price" class="text-amber-400">0 ₺</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    let catalog = [];
    let currentTable = null;
    let cart = [];
    let selectedProduct = null;
    let selectedSize = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      currentTable = urlParams.get('masa') || urlParams.get('table') || urlParams.get('m') || localStorage.getItem('evreka_customer_table');
      if (currentTable) localStorage.setItem('evreka_customer_table', currentTable);

      if (!currentTable) { document.getElementById('no-table-screen').classList.remove('hidden'); return; }
      document.getElementById('active-table-display').innerText = currentTable;
      document.getElementById('cart-drawer-table-display').innerText = currentTable;

      await loadCatalog();
      setInterval(checkActiveOrdersMini, 2000);
    });

    async function loadCatalog() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        if (data.success) {
          catalog = data.catalog || [];
          renderProducts('all');
        }
      } catch (e) {}
    }

    function renderProducts(filter) {
      const list = document.getElementById('product-list');
      const filtered = filter === 'all' ? catalog : catalog.filter(p => p.category === filter);
      list.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-3xl overflow-hidden border shadow-sm flex flex-col justify-between">
          <div>
            <div class="h-40 w-full overflow-hidden relative"><img src="${p.image}" class="w-full h-full object-cover"><span class="absolute top-3 right-3 bg-slate-900/85 text-amber-400 font-extrabold text-xs px-3 py-1 rounded-xl">${p.basePrice} ₺</span></div>
            <div class="p-4"><h3 class="font-black text-slate-900 text-base">${p.title}</h3><p class="text-xs text-slate-500 mt-1">${p.description}</p></div>
          </div>
          <div class="p-4 pt-0"><button onclick="openOptionsModal('${p.id}')" class="w-full bg-slate-100 hover:bg-red-600 hover:text-white text-slate-800 font-extrabold text-xs py-2.5 rounded-xl transition">Ekle</button></div>
        </div>
      `).join('');
    }

    function openOptionsModal(id) {
      selectedProduct = catalog.find(p => p.id === id);
      selectedSize = selectedProduct.sizes && selectedProduct.sizes.length > 0 ? selectedProduct.sizes[0] : null;
      document.getElementById('modal-note').value = '';
      document.getElementById('modal-img').src = selectedProduct.image;
      document.getElementById('modal-title').innerText = selectedProduct.title;
      document.getElementById('modal-desc').innerText = selectedProduct.description;

      const sizeSec = document.getElementById('size-section');
      const sizesCont = document.getElementById('modal-sizes');
      if (selectedProduct.sizes && selectedProduct.sizes.length > 0) {
        sizeSec.classList.remove('hidden');
        sizesCont.innerHTML = selectedProduct.sizes.map((s, idx) => `
          <button onclick="selectSize('${s.id}')" id="size-btn-${s.id}" class="size-btn p-2 rounded-xl border text-left text-xs ${idx === 0 ? 'border-red-600 bg-red-50 text-red-600 font-bold' : 'border-slate-200'}">
            <div>${s.name}</div><div class="text-[10px] opacity-70">+${s.priceOffset} ₺</div>
          </button>
        `).join('');
      } else { sizeSec.classList.add('hidden'); }

      updateModalPrice();
      document.getElementById('options-modal').classList.remove('hidden');
    }

    function closeOptionsModal() { document.getElementById('options-modal').classList.add('hidden'); }
    function selectSize(id) {
      selectedSize = selectedProduct.sizes.find(s => s.id === id);
      document.querySelectorAll('.size-btn').forEach(b => b.className = "size-btn p-2 rounded-xl border text-left text-xs border-slate-200");
      document.getElementById(`size-btn-${id}`).className = "size-btn p-2 rounded-xl border text-left text-xs border-red-600 bg-red-50 text-red-600 font-bold";
      updateModalPrice();
    }
    function updateModalPrice() {
      let total = selectedProduct.basePrice + (selectedSize ? selectedSize.priceOffset : 0);
      document.getElementById('modal-total-price').innerText = `${total} ₺`;
      document.getElementById('modal-add-btn').onclick = () => { addToCart(total); closeOptionsModal(); };
    }
    function addToCart(totalPrice) {
      cart.push({ id: Date.now(), title: selectedProduct.title, size: selectedSize ? selectedSize.name : null, price: totalPrice, note: document.getElementById('modal-note').value.trim() });
      updateCartBar();
    }
    function updateCartBar() {
      document.getElementById('cart-badge').innerText = cart.length;
      document.getElementById('cart-total-price').innerText = `${cart.reduce((s,i)=>s+i.price,0)} ₺`;
      renderCartDrawerItems();
    }
    function toggleCartDrawer() {
      if (cart.length === 0) { alert('Sepetiniz boş'); return; }
      document.getElementById('cart-drawer').classList.toggle('active');
      document.getElementById('drawer-overlay').classList.toggle('hidden');
    }
    function closeCartDrawerExplicit() {
      document.getElementById('cart-drawer').classList.remove('active');
      document.getElementById('drawer-overlay').classList.add('hidden');
    }
    function renderCartDrawerItems() {
      document.getElementById('cart-items-container').innerHTML = cart.map((item, idx) => `
        <div class="bg-slate-50 p-3 rounded-2xl border flex justify-between items-start text-xs">
          <div><h4 class="font-extrabold text-slate-900">${item.title} ${item.size ? `(${item.size})` : ''}</h4><span class="font-black text-slate-900">${item.price} ₺</span></div>
          <button onclick="cart.splice(${idx},1); updateCartBar();" class="text-slate-400 hover:text-red-600"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
      document.getElementById('cart-drawer-total').innerText = `${cart.reduce((s,i)=>s+i.price,0)} ₺`;
    }
    async function submitOrderToAPI() {
      if (!currentTable || cart.length === 0) return;
      const res = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ tableName: currentTable, items: cart, totalPrice: cart.reduce((s,i)=>s+i.price,0) }) });
      const data = await res.json();
      if (data.success) {
        let ids = JSON.parse(localStorage.getItem(`evreka_orders_${currentTable}`) || '[]');
        ids.push(String(data.order.id));
        localStorage.setItem(`evreka_orders_${currentTable}`, JSON.stringify(ids));
        cart = []; updateCartBar(); closeCartDrawerExplicit();
        document.getElementById('order-success-modal').classList.remove('hidden');
      }
    }
    async function checkActiveOrdersMini() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success) {
          const ids = JSON.parse(localStorage.getItem(`evreka_orders_${currentTable}`) || '[]');
          const active = (data.orders || []).filter(o => ids.includes(String(o.id)) && o.status !== 'PAID' && o.status !== 'CANCELLED');
          if (active.length > 0) document.getElementById('mini-tracker-banner').classList.remove('hidden');
          else document.getElementById('mini-tracker-banner').classList.add('hidden');
        }
      } catch (e) {}
    }
    function toggleTrackerDrawer() { document.getElementById('tracker-drawer').classList.toggle('active'); document.getElementById('tracker-overlay').classList.toggle('hidden'); }
    function closeTrackerDrawer() { document.getElementById('tracker-drawer').classList.remove('active'); document.getElementById('tracker-overlay').classList.add('hidden'); }
    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.className = "cat-btn px-4 py-2 rounded-2xl bg-white text-slate-600 border text-xs font-bold whitespace-nowrap");
      btn.className = "cat-btn px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-black shadow-sm whitespace-nowrap";
      renderProducts(cat);
    }
  </script>
</body>
</html>
