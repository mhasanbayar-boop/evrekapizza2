<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - QR Menü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .drawer { transition: transform 0.3s ease-in-out; transform: translateY(100%); }
    .drawer.active { transform: translateY(0); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

  <!-- ÜST BAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-red-600 flex items-center justify-center text-white text-xl shadow-md">
          🍕
        </div>
        <div>
          <h1 class="font-black text-base text-slate-900 leading-none">EVREKA PİZZA</h1>
          <p class="text-[11px] text-slate-500 font-semibold mt-0.5">Taş Fırın Lezzetleri</p>
        </div>
      </div>
      <div class="bg-emerald-50 text-emerald-700 font-extrabold text-xs px-3.5 py-2 rounded-2xl border border-emerald-200 flex items-center gap-2">
        <i class="fa-solid fa-lock text-[10px]"></i>
        <span id="table-badge">Masa-1</span>
      </div>
    </div>
  </header>

  <!-- CANLI TAKİP BARI -->
  <div id="tracker-banner" class="hidden bg-slate-900 text-white px-4 py-2.5 sticky top-[57px] z-30 shadow-md">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2 text-xs font-bold">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span id="tracker-banner-text">Aktif Siparişiniz Var</span>
      </div>
      <button onclick="openTracker()" class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow">
        Takip Et ➔
      </button>
    </div>
  </div>

  <!-- ANA İÇERİK -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-4 pb-28 space-y-4">
    <!-- Banner -->
    <div class="bg-gradient-to-r from-red-600 to-amber-600 rounded-3xl p-6 text-white shadow-lg relative overflow-hidden">
      <h2 class="text-2xl font-black">Geleneksel Taş Fırın</h2>
      <p class="text-xs text-white/90 mt-1">Masadan QR kod ile kolayca sipariş verin.</p>
    </div>

    <!-- KAMPANYALAR BANNER ALANI -->
    <div id="campaigns-container" class="space-y-3"></div>

    <!-- Kategori Butonları -->
    <div class="overflow-x-auto no-scrollbar flex gap-2 py-1 sticky top-[65px] z-20 bg-slate-50">
      <button onclick="filterCat('all', this)" class="cat-btn px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-black whitespace-nowrap shadow-sm">Tümü</button>
      <button onclick="filterCat('pizza', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">Pizzalar</button>
      <button onclick="filterCat('burger', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">Burgerler</button>
      <button onclick="filterCat('salad', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">Salatalar</button>
      <button onclick="filterCat('side', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">Atıştırmalık</button>
      <button onclick="filterCat('beverage', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">İçecekler</button>
      <button onclick="filterCat('dessert', this)" class="cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap">Tatlılar</button>
    </div>

    <!-- ÜRÜN LİSTESİ -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
  </main>

  <!-- SEPET BARI -->
  <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-50 via-slate-50/90 to-transparent z-40">
    <div class="max-w-4xl mx-auto">
      <button onclick="toggleCart()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-black py-4 px-6 rounded-2xl shadow-xl flex items-center justify-between">
        <div class="flex items-center gap-3">
          <span id="cart-count" class="bg-red-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs">0</span>
          <span class="text-sm">Sepeti Görüntüle</span>
        </div>
        <span id="cart-total" class="text-amber-400 text-base">0 ₺</span>
      </button>
    </div>
  </div>

  <!-- SEPET ÇEKMECESİ -->
  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden"></div>
  <div id="cart-drawer" class="drawer fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
    <div class="p-5 border-b border-slate-100 flex justify-between items-center">
      <h3 class="font-black text-base text-slate-900">Sipariş Sepetiniz</h3>
      <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-3"></div>
    <div class="p-5 border-t border-slate-100 bg-slate-50 space-y-3">
      <div class="flex justify-between items-center font-bold text-sm">
        <span class="text-slate-600">Toplam:</span>
        <span id="drawer-total" class="text-red-600 text-xl font-black">0 ₺</span>
      </div>
      <button onclick="sendOrder()" id="send-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-black py-3.5 rounded-2xl text-sm shadow-lg">
        Garsona Siparişi Gönder
      </button>
    </div>
  </div>

  <!-- TAKİP ÇEKMECESİ -->
  <div id="tracker-overlay" onclick="openTracker()" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden"></div>
  <div id="tracker-drawer" class="drawer fixed bottom-0 left-0 right-0 bg-slate-900 text-white z-50 rounded-t-3xl max-h-[85vh] flex flex-col shadow-2xl">
    <div class="p-5 border-b border-slate-800 flex justify-between items-center">
      <h3 class="font-black text-base">Canlı Sipariş Takibi</h3>
      <button onclick="openTracker()" class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="tracker-items" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
  </div>

  <!-- ÜRÜN / KAMPANYA DETAY MODALI -->
  <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-xmark"></i></button>
      <img id="modal-img" src="" class="w-full h-44 object-cover rounded-2xl">
      <div>
        <h3 id="modal-title" class="font-black text-lg text-slate-900"></h3>
        <p id="modal-desc" class="text-xs text-slate-500 mt-1"></p>
      </div>

      <!-- BOYUT SEÇİMİ -->
      <div id="modal-sizes-box">
        <label class="block text-xs font-black text-slate-700 uppercase mb-2">Boyut Seçin *</label>
        <div id="modal-sizes" class="grid grid-cols-2 gap-2"></div>
      </div>

      <!-- SERVİS / MENÜ / PAKET SEÇENEKLERİ (Sadece Pizza ve Burger) -->
      <div id="service-options-section" class="hidden">
        <label class="block text-xs font-black text-slate-700 uppercase mb-2">Servis ve Menü Seçenekleri *</label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="selectServiceType('normal')" type="button" id="srv-normal" class="srv-btn p-2.5 rounded-xl border text-left text-xs border-red-600 bg-red-50 text-red-600 font-bold">
            <div>Normal</div>
            <div class="text-[10px] opacity-70">+0 ₺</div>
          </button>
          <button onclick="selectServiceType('menu')" type="button" id="srv-menu" class="srv-btn p-2.5 rounded-xl border text-left text-xs border-slate-200 text-slate-600">
            <div>Menü (+80 ₺)</div>
            <div class="text-[10px] opacity-70">Patates + İçecek</div>
          </button>
          <button onclick="selectServiceType('paket')" type="button" id="srv-paket" class="srv-btn p-2.5 rounded-xl border text-left text-xs border-slate-200 text-slate-600">
            <div>Paket (+120 ₺)</div>
            <div class="text-[10px] opacity-70">Patates + İçecek</div>
          </button>
        </div>

        <div id="menu-details-box" class="mt-3 hidden bg-slate-50 border border-slate-200 rounded-2xl p-3.5 space-y-3">
          <div class="text-xs font-bold text-emerald-700 flex items-center gap-1.5">
            <i class="fa-solid fa-circle-check"></i> Zorunlu: Orta Boy Patates Kızartması dahildir.
          </div>
          <div>
            <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">İçecek Seçin *</label>
            <div class="grid grid-cols-2 gap-2" id="menu-drinks-container"></div>
          </div>
        </div>
      </div>

      <!-- KAMPANYA SEÇENEKLERİ -->
      <div id="campaign-options-section" class="hidden">
        <label class="block text-xs font-black text-slate-700 uppercase mb-2">Kampanya Seçenekleri *</label>
        <div id="modal-campaign-options" class="space-y-3"></div>
      </div>

      <!-- GARSON NOTU -->
      <div>
        <label class="block text-xs font-black text-slate-700 uppercase mb-1">Garson Notu</label>
        <input type="text" id="modal-note" placeholder="Örn: Soslu olsun..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs outline-none focus:border-red-500">
      </div>

      <button onclick="handleModalAddButton()" class="w-full bg-slate-900 text-white font-black py-3.5 rounded-2xl text-sm flex justify-between px-6 shadow-lg">
        <span>Sepete Ekle</span>
        <span id="modal-price" class="text-amber-400">0 ₺</span>
      </button>
    </div>
  </div>

  <script>
    let catalog = [
      { id: '1', title: 'Pepperoni Pizza', category: 'pizza', price: 260, description: 'Mozzarella, yoğun sucuk dilimleri, özel domates sosu', image: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500', sizes: [{name: 'Orta Boy', price: 0}, {name: 'Büyük Boy', price: 70}] },
      { id: '2', title: 'Margherita Pizza', category: 'pizza', price: 240, description: 'Taze mozzarella, fesleğen yaprakları', image: 'https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500', sizes: [{name: 'Orta Boy', price: 0}, {name: 'Büyük Boy', price: 60}] },
      { id: '3', title: 'Cheeseburger', category: 'burger', price: 260, description: '150gr dana köfte, cheddar peyniri, karamelize soğan', image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500' },
      { id: '4', title: 'Sezar Salatası', category: 'salad', price: 190, description: 'Izgara tavuk dilimleri, marul, kruton, sezar sos', image: 'https://images.unsplash.com/photo-1550304943-4f24f54ddde9?w=500' },
      { id: '5', title: 'Patates Kızartması', category: 'side', price: 110, description: 'Çıtır patates, özel baharatlar ile', image: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500' },
      { id: '6', title: 'Coca-Cola (330ml)', category: 'beverage', price: 60, description: 'Soğuk kutu içecek', image: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500' },
      { id: '7', title: 'Çikolatalı Sufle', category: 'dessert', price: 150, description: 'Sıcak akışkan çikolatalı sufle', image: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=500' }
    ];

    let campaigns = [
      { id: 'camp_1', title: 'Haftanın Özel Menüsü', description: 'Seçeceğiniz orta boy pizza + kutu içecek sadece 320 ₺!', badge: '%15 İNDİRİM', image: 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500' }
    ];

    let availableMenuDrinks = [
      { name: 'ColaTurka / Sarıyer (200ml Şişe)', extraPrice: 0 },
      { name: 'Pepsi (200ml Şişe)', extraPrice: 0 },
      { name: 'Coca-Cola (200ml Şişe)', extraPrice: 0 },
      { name: 'Ayran', extraPrice: 0 },
      { name: 'Sade Soda Şişe', extraPrice: 0 },
      { name: 'ColaTurka / Sarıyer (330ml Kutu)', extraPrice: 20 },
      { name: 'Pepsi (330ml Kutu)', extraPrice: 20 },
      { name: 'Coca-Cola (330ml Kutu)', extraPrice: 20 }
    ];

    let currentTable = 'Masa-1';
    let cart = [];
    let activeProduct = null;
    let selectedSizePrice = 0;
    let selectedSizeName = '';
    
    let selectedServiceType = 'normal';
    let selectedMenuDrink = availableMenuDrinks[0];

    let isCampaignModal = false;
    let selectedCampaignForModal = null;
    let selectedCampPizza = null;
    let selectedCampaignDrink = availableMenuDrinks[0];

    // SAYFA AÇILDIĞI AN BAŞLAT
    (function initApp() {
      const params = new URLSearchParams(window.location.search);
      currentTable = params.get('masa') || params.get('table') || localStorage.getItem('evreka_table') || 'Masa-1';
      localStorage.setItem('evreka_table', currentTable);
      const badge = document.getElementById('table-badge');
      if (badge) badge.innerText = currentTable;

      renderProducts('all');
      renderCampaigns();
      fetchServerCatalog();
      checkOrders();
      setInterval(checkOrders, 2000);
    })();

    async function fetchServerCatalog() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        let rawList = [];
        if (Array.isArray(data)) rawList = data;
        else if (data.catalog && Array.isArray(data.catalog)) rawList = data.catalog;
        else if (data.data && Array.isArray(data.data)) rawList = data.data;

        if (rawList.length > 0) {
          catalog = rawList.map(item => ({
            id: item.id || item._id || Math.random().toString(),
            title: item.title || item.name || 'Ürün',
            category: item.category || 'pizza',
            price: Number(item.basePrice || item.price || item.tutar || 250),
            description: item.description || item.desc || item.aciklama || '',
            image: item.image || item.img || 'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=500',
            sizes: Array.isArray(item.sizes) ? item.sizes : []
          }));
          renderProducts('all');
        }
      } catch (e) {}
    }

    function renderCampaigns() {
      const container = document.getElementById('campaigns-container');
      if (!container || campaigns.length === 0) {
        if (container) container.innerHTML = '';
        return;
      }
      container.innerHTML = campaigns.map(c => `
        <div onclick="openCampaignModal('${c.id}')" class="bg-gradient-to-r from-red-950 via-slate-900 to-slate-900 border border-red-500/40 rounded-3xl p-4 text-white shadow-xl flex items-center justify-between gap-4 cursor-pointer hover:border-red-500 transition group">
          <div class="flex items-center gap-3.5">
            <img src="${c.image}" class="w-16 h-16 rounded-2xl object-cover shadow-md flex-shrink-0 group-hover:scale-105 transition">
            <div class="space-y-1">
              <span class="bg-red-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-lg shadow">${c.badge || 'KAMPANYA'}</span>
              <h3 class="text-sm font-black text-white leading-snug">${c.title}</h3>
              <p class="text-[11px] text-slate-300 line-clamp-1">${c.description || ''}</p>
            </div>
          </div>
          <div class="w-10 h-10 rounded-2xl bg-red-600/20 group-hover:bg-red-600 text-red-400 group-hover:text-white flex items-center justify-center transition flex-shrink-0 shadow">
            <i class="fa-solid fa-plus text-xs"></i>
          </div>
        </div>
      `).join('');
    }
    window.renderCampaigns = renderCampaigns;

    function openCampaignModal(id) {
      const camp = campaigns.find(c => String(c.id) === String(id));
      if (!camp) return;

      isCampaignModal = true;
      selectedCampaignForModal = camp;
      const pizzas = catalog.filter(p => String(p.category || '').toLowerCase() === 'pizza');
      selectedCampPizza = pizzas.length > 0 ? pizzas[0] : { title: 'Özel Pizza' };
      selectedCampaignDrink = availableMenuDrinks[0];

      document.getElementById('modal-img').src = camp.image;
      document.getElementById('modal-title').innerText = camp.title;
      document.getElementById('modal-desc').innerText = camp.description || '';
      document.getElementById('modal-note').value = '';

      document.getElementById('modal-sizes-box').classList.add('hidden');
      document.getElementById('service-options-section').classList.add('hidden');
      document.getElementById('campaign-options-section').classList.remove('hidden');

      let pizzaSelectorHtml = '';
      if (pizzas.length > 0) {
        pizzaSelectorHtml = `
          <div class="mb-3">
            <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">Pizza Seçin *</label>
            <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
              ${pizzas.map((p, idx) => `
                <button onclick="selectCampPizza('${p.id}')" type="button" id="camp-piz-${p.id}" class="camp-piz-btn p-2 rounded-xl border text-left text-[11px] ${idx === 0 ? 'border-red-600 bg-red-50 text-red-600 font-bold' : 'border-slate-200 text-slate-600'}">
                  <div class="truncate">${p.title}</div>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      document.getElementById('modal-campaign-options').innerHTML = pizzaSelectorHtml + `
        <div class="text-xs font-bold text-emerald-700 flex items-center gap-1.5 mb-2">
          <i class="fa-solid fa-circle-check"></i> Zorunlu: Orta Boy Patates Kızartması dahildir.
        </div>
        <div>
          <label class="block text-[11px] font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">İçecek Seçin *</label>
          <div class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto">
            ${availableMenuDrinks.map((d, idx) => `
              <button onclick="selectCampDrinkByName('${d.name}')" type="button" class="camp-drink-btn p-2 rounded-xl border text-left text-[11px] ${idx === 0 ? 'border-red-600 bg-red-50 text-red-600 font-bold' : 'border-slate-200 text-slate-600'}">
                <div class="truncate">${d.name}</div>
                <div class="text-[10px] opacity-70">${d.extraPrice > 0 ? `+${d.extraPrice} ₺` : 'Fiyata Dahil'}</div>
              </button>
            `).join('')}
          </div>
        </div>
      `;

      updateCampaignModalTotal();
      document.getElementById('modal').classList.remove('hidden');
    }
    window.openCampaignModal = openCampaignModal;

    function selectCampPizza(pizzaId) {
      const pizzas = catalog.filter(p => String(p.category || '').toLowerCase() === 'pizza');
      selectedCampPizza = pizzas.find(p => String(p.id) === String(pizzaId));
      document.querySelectorAll('.camp-piz-btn').forEach(b => {
        if (b.id === `camp-piz-${pizzaId}`) {
          b.className = "camp-piz-btn p-2 rounded-xl border text-left text-[11px] border-red-600 bg-red-50 text-red-600 font-bold";
        } else {
          b.className = "camp-piz-btn p-2 rounded-xl border text-left text-[11px] border-slate-200 text-slate-600";
        }
      });
      updateCampaignModalTotal();
    }
    window.selectCampPizza = selectCampPizza;

    function selectCampDrinkByName(name) {
      const found = availableMenuDrinks.find(d => d.name === name);
      if (found) {
        selectedCampaignDrink = found;
        document.querySelectorAll('.camp-drink-btn').forEach(b => {
          if (b.innerText.includes(name)) {
            b.className = "camp-drink-btn p-2 rounded-xl border text-left text-[11px] border-red-600 bg-red-50 text-red-600 font-bold";
          } else {
            b.className = "camp-drink-btn p-2 rounded-xl border text-left text-[11px] border-slate-200 text-slate-600";
          }
        });
        updateCampaignModalTotal();
      }
    }
    window.selectCampDrinkByName = selectCampDrinkByName;

    function updateCampaignModalTotal() {
      let total = 320 + selectedCampaignDrink.extraPrice;
      document.getElementById('modal-price').innerText = `${total} ₺`;
    }

    function filterCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => {
        b.className = "cat-btn px-4 py-2 rounded-2xl bg-white text-slate-700 border border-slate-200 text-xs font-bold whitespace-nowrap";
      });
      if (btn) {
        btn.className = "cat-btn px-4 py-2 rounded-2xl bg-slate-900 text-white text-xs font-black whitespace-nowrap shadow-sm";
      }
      renderProducts(cat);
    }
    window.filterCat = filterCat;

    function renderProducts(cat) {
      const grid = document.getElementById('product-grid');
      if (!grid) return;
      
      const filtered = cat === 'all' ? catalog : catalog.filter(p => String(p.category || '').toLowerCase() === cat.toLowerCase());

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-xs">Bu kategoride ürün bulunamadı.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div onclick="openModal('${p.id}')" class="bg-white rounded-3xl p-3.5 border border-slate-200 shadow-sm hover:shadow-md transition flex gap-3.5 cursor-pointer">
          <img src="${p.image}" class="w-24 h-24 rounded-2xl object-cover flex-shrink-0">
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-black text-slate-900 text-sm leading-snug">${p.title}</h3>
              <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${p.description}</p>
            </div>
            <div class="flex items-center justify-between mt-2">
              <span class="text-xs font-black text-red-600">${p.price} ₺</span>
              <div class="w-7 h-7 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center text-xs">
                <i class="fa-solid fa-plus"></i>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }
    window.renderProducts = renderProducts;

    function openModal(id) {
      const prod = catalog.find(p => String(p.id) === String(id));
      if (!prod) return;

      isCampaignModal = false;
      activeProduct = prod;
      selectedSizePrice = 0;
      selectedSizeName = '';
      selectedServiceType = 'normal';
      selectedMenuDrink = availableMenuDrinks[0];

      document.getElementById('modal-img').src = prod.image;
      document.getElementById('modal-title').innerText = prod.title;
      document.getElementById('modal-desc').innerText = prod.description;
      document.getElementById('modal-note').value = '';

      document.getElementById('campaign-options-section').classList.add('hidden');

      const sizesBox = document.getElementById('modal-sizes-box');
      const sizesContainer = document.getElementById('modal-sizes');

      if (prod.sizes && prod.sizes.length > 0) {
        sizesBox.classList.remove('hidden');
        selectedSizePrice = prod.sizes[0].price || 0;
        selectedSizeName = prod.sizes[0].name || '';
        sizesContainer.innerHTML = prod.sizes.map((sz, idx) => `
          <button onclick="selectSize(${sz.price || 0}, '${sz.name}', this)" type="button" class="sz-btn p-2.5 rounded-xl border text-left text-xs ${idx === 0 ? 'border-red-600 bg-red-50 text-red-600 font-bold' : 'border-slate-200 text-slate-600'}">
            <div>${sz.name}</div>
            <div class="text-[10px] opacity-70">+${sz.price || 0} ₺</div>
          </button>
        `).join('');
      } else {
        sizesBox.classList.add('hidden');
      }

      // SADECE PİZZA VE BURGERLERDE MENÜ/PAKET SEÇENEĞİ GÖSTER
      const serviceSec = document.getElementById('service-options-section');
      const cat = String(prod.category || '').toLowerCase();
      if (cat === 'pizza' || cat === 'burger') {
        serviceSec.classList.remove('hidden');
        updateServiceUI();
      } else {
        serviceSec.classList.add('hidden');
      }

      updateModalPrice();
      document.getElementById('modal').classList.remove('hidden');
    }
    window.openModal = openModal;

    function selectSize(price, name, btn) {
      selectedSizePrice = price;
      selectedSizeName = name;
      document.querySelectorAll('.sz-btn').forEach(b => {
        b.className = "sz-btn p-2.5 rounded-xl border text-left text-xs border-slate-200 text-slate-600";
      });
      if (btn) {
        btn.className = "sz-btn p-2.5 rounded-xl border text-left text-xs border-red-600 bg-red-50 text-red-600 font-bold";
      }
      updateModalPrice();
    }
    window.selectSize = selectSize;

    function selectServiceType(type) {
      selectedServiceType = type;
      updateServiceUI();
      updateModalPrice();
    }
    window.selectServiceType = selectServiceType;

    function updateServiceUI() {
      ['normal', 'menu', 'paket'].forEach(t => {
        const btn = document.getElementById(`srv-${t}`);
        if (!btn) return;
        if (t === selectedServiceType) {
          btn.className = "srv-btn p-2.5 rounded-xl border text-left text-xs border-red-600 bg-red-50 text-red-600 font-bold";
        } else {
          btn.className = "srv-btn p-2.5 rounded-xl border text-left text-xs border-slate-200 text-slate-600";
        }
      });

      const menuDetailsBox = document.getElementById('menu-details-box');
      if (selectedServiceType === 'menu' || selectedServiceType === 'paket') {
        menuDetailsBox.classList.remove('hidden');
        renderMenuDrinks();
      } else {
        menuDetailsBox.classList.add('hidden');
      }
    }

    function renderMenuDrinks() {
      const container = document.getElementById('menu-drinks-container');
      if (!container) return;
      container.innerHTML = availableMenuDrinks.map((d) => {
        const isSelected = selectedMenuDrink.name === d.name;
        return `
          <button onclick="selectMenuDrinkByName('${d.name}')" type="button" class="menu-drink-btn p-2 rounded-xl border text-left text-[11px] ${isSelected ? 'border-red-600 bg-red-50 text-red-600 font-bold' : 'border-slate-200 text-slate-600'}">
            <div class="truncate">${d.name}</div>
            <div class="text-[10px] opacity-70">${d.extraPrice > 0 ? `+${d.extraPrice} ₺` : 'Fiyata Dahil'}</div>
          </button>
        `;
      }).join('');
    }
    window.renderMenuDrinks = renderMenuDrinks;

    function selectMenuDrinkByName(name) {
      const found = availableMenuDrinks.find(d => d.name === name);
      if (found) {
        selectedMenuDrink = found;
        renderMenuDrinks();
        updateModalPrice();
      }
    }
    window.selectMenuDrinkByName = selectMenuDrinkByName;

    function updateModalPrice() {
      if (isCampaignModal) {
        updateCampaignModalTotal();
        return;
      }
      if (!activeProduct) return;
      let total = Number(activeProduct.price) + Number(selectedSizePrice);

      const cat = String(activeProduct.category || '').toLowerCase();
      if (cat === 'pizza' || cat === 'burger') {
        if (selectedServiceType === 'menu') {
          total += 80 + Number(selectedMenuDrink.extraPrice || 0);
        } else if (selectedServiceType === 'paket') {
          total += 120 + Number(selectedMenuDrink.extraPrice || 0);
        }
      }

      document.getElementById('modal-price').innerText = `${total} ₺`;
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }
    window.closeModal = closeModal;

    function handleModalAddButton() {
      if (isCampaignModal) {
        addCampaignToCart();
      } else {
        addToCart();
      }
      closeModal();
    }
    window.handleModalAddButton = handleModalAddButton;

    function addCampaignToCart() {
      if (!selectedCampaignForModal) return;
      let total = 320 + selectedCampaignDrink.extraPrice;
      cart.push({
        id: Date.now(),
        title: `🔥 Kampanya: ${selectedCampaignForModal.title}`,
        size: `Pizza: ${selectedCampPizza ? selectedCampPizza.title : 'Özel Pizza'} • Patates + İçecek: ${selectedCampaignDrink.name}${selectedCampaignDrink.extraPrice > 0 ? ` (+${selectedCampaignDrink.extraPrice}₺)` : ''}`,
        price: total,
        note: document.getElementById('modal-note').value.trim()
      });
      updateCartUI();
    }

    function addToCart() {
      if (!activeProduct) return;
      let unitPrice = Number(activeProduct.price) + Number(selectedSizePrice);
      let variantDesc = selectedSizeName ? selectedSizeName : '';

      const cat = String(activeProduct.category || '').toLowerCase();
      if (cat === 'pizza' || cat === 'burger') {
        if (selectedServiceType === 'menu') {
          unitPrice += 80 + Number(selectedMenuDrink.extraPrice || 0);
          variantDesc += (variantDesc ? ' • ' : '') + `Menü (+80₺, Patates + ${selectedMenuDrink.name}${selectedMenuDrink.extraPrice > 0 ? ` +${selectedMenuDrink.extraPrice}₺` : ''})`;
        } else if (selectedServiceType === 'paket') {
          unitPrice += 120 + Number(selectedMenuDrink.extraPrice || 0);
          variantDesc += (variantDesc ? ' • ' : '') + `Paket (+120₺, Patates + ${selectedMenuDrink.name}${selectedMenuDrink.extraPrice > 0 ? ` +${selectedMenuDrink.extraPrice}₺` : ''})`;
        } else {
          variantDesc += (variantDesc ? ' • ' : '') + `Normal Servis`;
        }
      }

      cart.push({
        id: Date.now(),
        title: activeProduct.title,
        size: variantDesc,
        price: unitPrice,
        note: document.getElementById('modal-note').value.trim()
      });
      updateCartUI();
    }

    function updateCartUI() {
      document.getElementById('cart-count').innerText = cart.length;
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-total').innerText = `${total} ₺`;
      document.getElementById('drawer-total').innerText = `${total} ₺`;

      const container = document.getElementById('cart-items');
      if (cart.length === 0) {
        container.innerHTML = `<div class="py-12 text-center text-slate-400 text-xs">Sepetiniz boş.</div>`;
        return;
      }
      container.innerHTML = cart.map((item, idx) => `
        <div class="bg-slate-50 border border-slate-200 p-3.5 rounded-2xl flex items-center justify-between gap-3">
          <div>
            <h4 class="font-bold text-slate-900 text-xs">${item.title}</h4>
            <p class="text-[11px] text-slate-500 mt-0.5">${item.size || ''}</p>
            ${item.note ? `<p class="text-[10px] text-amber-600 mt-0.5">Not: ${item.note}</p>` : ''}
            <div class="text-xs font-black text-red-600 mt-1">${item.price} ₺</div>
          </div>
          <button onclick="removeFromCart(${idx})" class="w-7 h-7 rounded-lg bg-red-50 text-red-600 flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
        </div>
      `).join('');
    }
    window.updateCartUI = updateCartUI;

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCartUI();
    }
    window.removeFromCart = removeFromCart;

    function toggleCart() {
      document.getElementById('cart-drawer').classList.toggle('active');
      document.getElementById('cart-overlay').classList.toggle('hidden');
    }
    window.toggleCart = toggleCart;

    function openTracker() {
      document.getElementById('tracker-drawer').classList.toggle('active');
      document.getElementById('tracker-overlay').classList.toggle('hidden');
      renderTrackerOrders();
    }
    window.openTracker = openTracker;

    async function sendOrder() {
      if (cart.length === 0) return;
      const btn = document.getElementById('send-btn');
      btn.disabled = true;
      btn.innerText = "Gönderiliyor...";

      const payload = {
        tableName: currentTable,
        table: currentTable,
        items: cart.map(i => ({ title: i.title, size: i.size, price: i.price, note: i.note })),
        totalPrice: cart.reduce((sum, i) => sum + i.price, 0),
        total: cart.reduce((sum, i) => sum + i.price, 0)
      };

      let orderId = Date.now();
      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success && (data.order || data.id)) {
          orderId = data.order?.id || data.order?._id || data.id || Date.now();
        } else if (data.id || data._id) {
          orderId = data.id || data._id;
        }
      } catch (e) {} finally {
        saveOrderIdLocally(orderId);
        cart = [];
        updateCartUI();
        toggleCart();
        btn.disabled = false;
        btn.innerText = "Garsona Siparişi Gönder";
        openTracker();
      }
    }
    window.sendOrder = sendOrder;

    function getLocalOrders() {
      const list = localStorage.getItem(`orders_${currentTable}`);
      return list ? JSON.parse(list) : [];
    }

    function saveOrderIdLocally(id) {
      let list = getLocalOrders();
      if (!list.includes(String(id))) {
        list.push(String(id));
        localStorage.setItem(`orders_${currentTable}`, JSON.stringify(list));
      }
    }

    async function checkOrders() {
      const orderIds = getLocalOrders();
      if (orderIds.length === 0) {
        const banner = document.getElementById('tracker-banner');
        if (banner) banner.classList.add('hidden');
        return;
      }

      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        
        let orderList = [];
        if (Array.isArray(data)) orderList = data;
        else if (data.orders && Array.isArray(data.orders)) orderList = data.orders;
        else if (data.data && Array.isArray(data.data)) orderList = data.data;

        const activeIds = orderIds.filter(id => {
          const found = orderList.find(o => String(o.id || o._id) === String(id));
          if (!found) return true;
          const st = String(found.status || '').toUpperCase();
          return st !== 'PAID' && st !== 'COMPLETED' && st !== 'CANCELLED';
        });

        if (activeIds.length !== orderIds.length) {
          localStorage.setItem(`orders_${currentTable}`, JSON.stringify(activeIds));
        }

        const banner = document.getElementById('tracker-banner');
        if (banner) {
          if (activeIds.length > 0) banner.classList.remove('hidden');
          else banner.classList.add('hidden');
        }
      } catch (e) {}
    }

    async function renderTrackerOrders() {
      const container = document.getElementById('tracker-items');
      const orderIds = getLocalOrders();

      if (orderIds.length === 0) {
        container.innerHTML = `<div class="py-12 text-center text-slate-400 text-xs">Aktif siparişiniz bulunmuyor.</div>`;
        return;
      }

      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        
        let orderList = [];
        if (Array.isArray(data)) orderList = data;
        else if (data.orders && Array.isArray(data.orders)) orderList = data.orders;
        else if (data.data && Array.isArray(data.data)) orderList = data.data;

        const myOrders = orderList.filter(o => orderIds.includes(String(o.id || o._id)) && String(o.status || '').toUpperCase() !== 'PAID' && String(o.status || '').toUpperCase() !== 'COMPLETED' && String(o.status || '').toUpperCase() !== 'CANCELLED');
        
        if (myOrders.length === 0) {
          container.innerHTML = `<div class="py-12 text-center text-slate-400 text-xs">Aktif siparişiniz bulunmuyor.</div>`;
          return;
        }

        container.innerHTML = myOrders.map(o => `
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 space-y-2">
            <div class="flex justify-between items-center text-xs font-bold text-amber-400 border-b border-slate-700 pb-2">
              <span>Sipariş #${o.id || o._id}</span>
              <span class="px-2 py-0.5 rounded bg-slate-700 text-white">${o.status || 'WAITING'}</span>
            </div>
            <div class="space-y-1 text-xs">
              ${(o.items || []).map(i => `<div class="flex justify-between text-slate-300"><span>${i.title \vert{}\vert{} i.name} (${i.size || ''})</span><span class="font-bold">${i.price || i.tutar} ₺</span></div>`).join('')}
            </div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = `<div class="py-12 text-center text-slate-400 text-xs">Sipariş bilgileri yüklenemedi.</div>`;
      }
    }
  </script>
</body>
</html>
