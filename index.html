<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-950 text-white">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evreka Pizza - Sipariş & Menü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="h-full bg-slate-900 text-slate-100 flex flex-col min-h-screen">

  <!-- ÜST HEADER -->
  <header class="bg-slate-950 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl bg-red-600 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-red-600/30">🍕</div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-white">Evreka Pizza</h1>
          <p id="table-indicator" class="text-[11px] text-amber-400 font-bold">Masa Yükleniyor...</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="openTrackingModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center gap-2 transition border border-slate-700">
          <i class="fa-solid fa-clock-rotate-left text-amber-400"></i> Siparişlerim
        </button>
        <button onclick="openCartModal()" class="relative bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-2xl text-xs font-extrabold flex items-center gap-2 transition shadow-lg shadow-red-600/20">
          <i class="fa-solid fa-basket-shopping"></i> Sepet
          <span id="cart-badge" class="bg-white text-red-600 px-2 py-0.5 rounded-full text-[10px] font-black hidden">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ANA İÇERİK -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-grow space-y-6 w-full">
    
    <!-- KAMPANYALAR BANNER ALANI -->
    <div id="campaigns-banner-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <!-- KATEGORİ FİLTRELERİ -->
    <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterCategory('all')" id="cat-btn-all" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-extrabold bg-red-600 text-white transition shadow">Tümü</button>
      <button onclick="filterCategory('pizza')" id="cat-btn-pizza" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Pizzalar</button>
      <button onclick="filterCategory('burger')" id="cat-btn-burger" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Burgerler</button>
      <button onclick="filterCategory('salad')" id="cat-btn-salad" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Salatalar</button>
      <button onclick="filterCategory('side')" id="cat-btn-side" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Atıştırmalıklar</button>
      <button onclick="filterCategory('beverage')" id="cat-btn-beverage" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">İçecekler</button>
      <button onclick="filterCategory('dessert')" id="cat-btn-dessert" class="category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Tatlılar</button>
    </div>

    <!-- ÜRÜN LİSTESİ -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- ÜRÜN / KAMPANYA SEÇİM MODALI -->
  <div id="product-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-5 animate-in fade-in zoom-in duration-200">
      <div class="flex justify-between items-start gap-4">
        <div>
          <h3 id="modal-title" class="text-lg font-black text-white">Ürün Adı</h3>
          <p id="modal-desc" class="text-xs text-slate-400 mt-1">Açıklama</p>
        </div>
        <button onclick="closeProductModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center hover:bg-slate-600 transition"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Boyut / Menü Seçenekleri -->
      <div id="modal-sizes-container" class="space-y-3 hidden">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block" id="modal-options-label">Boyut Seçimi</label>
        <div id="sizes-radio-group" class="grid grid-cols-2 gap-2"></div>
      </div>

      <!-- Menüye Dönüştür / Patates & Kola Seçimi (Zorunlu Orta Boy Patates + İçecek) -->
      <div id="menu-upgrade-container" class="space-y-3 pt-2 border-t border-slate-700 hidden">
        <label class="flex items-center gap-2 cursor-pointer bg-red-600/10 border border-red-500/30 p-3 rounded-2xl">
          <input type="checkbox" id="make-menu-check" onchange="toggleMenuUpgrade()" class="w-4 h-4 text-red-600 rounded focus:ring-red-500">
          <span class="text-xs font-black text-red-400">🍟 Menü Yap (+60 ₺) - Orta Boy Patates Dahil!</span>
        </label>
        
        <div id="menu-beverage-box" class="space-y-1.5 hidden">
          <span class="text-[11px] font-bold text-slate-400 block">İçecek Seçimi (Zorunlu):</span>
          <select id="menu-beverage-select" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs font-bold text-white focus:outline-none focus:ring-2 focus:ring-red-500">
            <option value="Kola (Kutu)">Kola (Kutu 330ml)</option>
            <option value="Fanta (Kutu)">Fanta (Kutu 330ml)</option>
            <option value="Ayran">Ayran (300ml)</option>
            <option value="Soğuk Çay">Soğuk Çay (Ice Tea)</option>
            <option value="Sade Soda">Sade Maden Suyu</option>
          </select>
        </div>
      </div>

      <!-- Özel Not -->
      <div class="space-y-2">
        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider block">Sipariş Notu (Opsiyonel)</label>
        <input type="text" id="modal-note" placeholder="Örn: Soğan olmasın, az pişsin..." class="w-full bg-slate-900 border border-slate-700 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:ring-2 focus:ring-red-500">
      </div>

      <div class="flex items-center justify-between pt-2">
        <div>
          <span class="text-[10px] text-slate-400 font-bold uppercase block">Fiyat</span>
          <span id="modal-price" class="text-2xl font-black text-amber-400">0 ₺</span>
        </div>
        <button onclick="confirmAddToCart()" class="bg-red-600 hover:bg-red-700 text-white font-extrabold px-6 py-3.5 rounded-2xl text-xs transition shadow-lg shadow-red-600/30">Sepete Ekle</button>
      </div>
    </div>
  </div>

  <!-- SEPET MODALI -->
  <div id="cart-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-5 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-black text-white flex items-center gap-2"><i class="fa-solid fa-basket-shopping text-red-500"></i> Sepetim</h3>
        <button onclick="closeCartModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center hover:bg-slate-600 transition"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="cart-items-list" class="space-y-3 overflow-y-auto flex-grow pr-1"></div>

      <div class="border-t border-slate-700 pt-4 space-y-4">
        <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-700 flex justify-between items-center text-xs">
          <span class="text-slate-400 font-bold">Sipariş Verilen Konum:</span>
          <span id="cart-table-badge" class="font-black text-amber-400">Masa -</span>
        </div>

        <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-700">
          <span class="text-xs font-bold text-slate-400">Toplam Tutar:</span>
          <span id="cart-total-price" class="text-2xl font-black text-emerald-400">0 ₺</span>
        </div>

        <button onclick="submitOrder()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold py-4 rounded-2xl text-xs transition shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
          <i class="fa-solid fa-check-circle"></i> Siparişi Onayla ve Mutfağa Gönder
        </button>
      </div>
    </div>
  </div>

  <!-- SİPARİŞ TAKİP MODALI -->
  <div id="tracking-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-3xl p-6 shadow-2xl space-y-5 max-h-[90vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-700 pb-3">
        <h3 class="text-lg font-black text-white flex items-center gap-2"><i class="fa-solid fa-clock-rotate-left text-amber-400"></i> Sipariş Takibi (<span id="track-table-title"></span>)</h3>
        <button onclick="closeTrackingModal()" class="w-8 h-8 rounded-full bg-slate-700 text-slate-300 flex items-center justify-center hover:bg-slate-600 transition"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="tracking-orders-list" class="space-y-3 overflow-y-auto flex-grow pr-1"></div>
    </div>
  </div>

  <script>
    let catalog = [];
    let campaigns = [];
    let cart = [];
    let currentCategory = 'all';
    let selectedItemForModal = null;
    let selectedSizeOffset = 0;
    let selectedSizeName = '';
    let currentTableName = 'Masa 1';
    let isCampaignModal = false;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const masa = urlParams.get('masa') || urlParams.get('table');
      if (masa) {
        currentTableName = `Masa ${masa}`;
      }
      document.getElementById('table-indicator').innerText = `Konum: ${currentTableName}`;
      document.getElementById('cart-table-badge').innerText = currentTableName;
      document.getElementById('track-table-title').innerText = currentTableName;

      loadCampaigns();
      loadCatalog();
      setInterval(checkMyOrdersStatus, 3000);
    });

    async function loadCampaigns() {
      try {
        const res = await fetch('/api/campaigns');
        const data = await res.json();
        if (data.success && data.campaigns && data.campaigns.length > 0) {
          campaigns = data.campaigns;
          const container = document.getElementById('campaigns-banner-container');
          container.innerHTML = campaigns.map(c => `
            <div onclick="openCampaignModal('${c.id}')" class="bg-gradient-to-r from-red-950/90 to-slate-900 border border-red-500/30 hover:border-red-500/80 cursor-pointer rounded-3xl p-5 shadow-2xl flex items-center justify-between gap-4 text-white transition group">
              <div class="flex items-center gap-4">
                <img src="${c.image}" class="w-20 h-20 rounded-2xl object-cover shadow-md flex-shrink-0 group-hover:scale-105 transition">
                <div class="space-y-1">
                  <span class="bg-red-600 text-white text-[10px] font-black px-2.5 py-0.5 rounded-lg shadow">${c.badge}</span>
                  <h3 class="text-sm font-black text-white">${c.title}</h3>
                  <p class="text-xs text-slate-300 line-clamp-1">${c.description}</p>
                </div>
              </div>
              <div class="w-10 h-10 rounded-2xl bg-red-600/20 group-hover:bg-red-600 text-red-400 group-hover:text-white flex items-center justify-center font-bold text-sm transition flex-shrink-0">
                <i class="fa-solid fa-plus"></i>
              </div>
            </div>
          `).join('');
        } else {
          document.getElementById('campaigns-banner-container').innerHTML = '';
        }
      } catch (e) {}
    }

    async function loadCatalog() {
      try {
        const res = await fetch('/api/catalog');
        const data = await res.json();
        if (data.success) {
          catalog = data.catalog || [];
          renderProducts();
        }
      } catch (e) {}
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.className = "category-btn px-5 py-2.5 rounded-2xl text-xs font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
      });
      const activeBtn = document.getElementById(`cat-btn-${cat}`);
      if (activeBtn) {
        activeBtn.className = "category-btn px-5 py-2.5 rounded-2xl text-xs font-extrabold bg-red-600 text-white transition shadow";
      }
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const filtered = currentCategory === 'all' ? catalog : catalog.filter(i => String(i.category || '').toLowerCase() === currentCategory.toLowerCase());

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500 text-xs bg-slate-800/40 rounded-3xl border border-slate-800">Bu kategoride ürün bulunamadı.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="bg-slate-800 border border-slate-700/80 rounded-3xl overflow-hidden shadow-xl flex flex-col justify-between group hover:border-slate-600 transition">
          <div>
            <div class="relative h-48 overflow-hidden bg-slate-900">
              <img src="${item.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
              <div class="absolute top-3 right-3 bg-slate-950/80 backdrop-blur-md px-3 py-1 rounded-xl text-amber-400 font-black text-xs border border-slate-700">
                ${item.basePrice} ₺
              </div>
            </div>
            <div class="p-5 space-y-2">
              <h3 class="font-extrabold text-white text-base">${item.title}</h3>
              <p class="text-xs text-slate-400 line-clamp-2">${item.description || ''}</p>
            </div>
          </div>
          <div class="p-5 pt-0">
            <button onclick="openProductModal('${item.id}')" class="w-full bg-slate-900 hover:bg-red-600 text-slate-200 hover:text-white font-extrabold text-xs py-3 rounded-2xl transition shadow flex items-center justify-center gap-2 border border-slate-700 hover:border-red-600">
              <i class="fa-solid fa-plus"></i> Sepete Ekle
            </button>
          </div>
        </div>
      `).join('');
    }

    function openCampaignModal(campId) {
      const camp = campaigns.find(c => String(c.id) === String(campId));
      if (!camp) return;

      isCampaignModal = true;
      selectedItemForModal = {
        id: camp.id,
        title: camp.title,
        basePrice: 320,
        description: camp.description
      };

      document.getElementById('modal-title').innerText = camp.title;
      document.getElementById('modal-desc').innerText = camp.description;
      document.getElementById('modal-note').value = '';
      document.getElementById('modal-options-label').innerText = 'Kampanya İçecek Seçimi';

      document.getElementById('modal-sizes-container').classList.remove('hidden');
      document.getElementById('menu-upgrade-container').classList.add('hidden');

      const campaignOptions = [
        { name: 'Kola (Kutu 330ml)', offset: 0 },
        { name: 'Fanta (Kutu 330ml)', offset: 0 },
        { name: 'Ayran (300ml)', offset: 0 },
        { name: 'Soğuk Çay (Ice Tea)', offset: 0 }
      ];

      document.getElementById('sizes-radio-group').innerHTML = campaignOptions.map((opt, idx) => `
        <label class="flex items-center gap-2.5 bg-slate-900 border ${idx === 0 ? 'border-red-500 bg-red-500/10' : 'border-slate-700'} p-3 rounded-2xl cursor-pointer text-xs font-bold transition size-label">
          <input type="radio" name="product-size" value="${opt.offset}" ${idx === 0 ? 'checked' : ''} onchange="updateModalPrice(${opt.offset}, '${opt.name}')" class="text-red-600 focus:ring-red-500">
          <span>${opt.name}</span>
        </label>
      `).join('');

      selectedSizeOffset = 0;
      selectedSizeName = campaignOptions[0].name;

      updateModalPrice(0, selectedSizeName);
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function openProductModal(id) {
      isCampaignModal = false;
      selectedItemForModal = catalog.find(i => String(i.id) === String(id));
      if (!selectedItemForModal) return;

      document.getElementById('modal-title').innerText = selectedItemForModal.title;
      document.getElementById('modal-desc').innerText = selectedItemForModal.description || '';
      document.getElementById('modal-note').value = '';
      document.getElementById('modal-options-label').innerText = 'Boyut Seçimi';

      const sizesContainer = document.getElementById('modal-sizes-container');
      const radioGroup = document.getElementById('sizes-radio-group');
      const menuUpgradeContainer = document.getElementById('menu-upgrade-container');

      // Pizza veya Burger ise menü seçeneği sun
      const cat = String(selectedItemForModal.category || '').toLowerCase();
      if (cat === 'pizza' || cat === 'burger') {
        menuUpgradeContainer.classList.remove('hidden');
        document.getElementById('make-menu-check').checked = false;
        document.getElementById('menu-beverage-box').classList.add('hidden');
      } else {
        menuUpgradeContainer.classList.add('hidden');
      }

      if (selectedItemForModal.sizes && selectedItemForModal.sizes.length > 0) {
        sizesContainer.classList.remove('hidden');
        radioGroup.innerHTML = selectedItemForModal.sizes.map((s, idx) => `
          <label class="flex items-center gap-2.5 bg-slate-900 border ${idx === 0 ? 'border-red-500 bg-red-500/10' : 'border-slate-700'} p-3 rounded-2xl cursor-pointer text-xs font-bold transition size-label">
            <input type="radio" name="product-size" value="${s.priceOffset}" ${idx === 0 ? 'checked' : ''} onchange="updateModalPrice(${s.priceOffset}, '${s.name}')" class="text-red-600 focus:ring-red-500">
            <span>${s.name} ${s.priceOffset > 0 ? `(+${s.priceOffset} ₺)` : ''}</span>
          </label>
        `).join('');

        selectedSizeOffset = selectedItemForModal.sizes[0].priceOffset;
        selectedSizeName = selectedItemForModal.sizes[0].name;
      } else {
        sizesContainer.classList.add('hidden');
        radioGroup.innerHTML = '';
        selectedSizeOffset = 0;
        selectedSizeName = '';
      }

      updateModalPrice(selectedSizeOffset, selectedSizeName);
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function toggleMenuUpgrade() {
      const isChecked = document.getElementById('make-menu-check').checked;
      const bevBox = document.getElementById('menu-beverage-box');
      if (isChecked) {
        bevBox.classList.remove('hidden');
      } else {
        bevBox.classList.add('hidden');
      }
      updateModalPrice(selectedSizeOffset, selectedSizeName);
    }

    function updateModalPrice(offset, name) {
      selectedSizeOffset = offset;
      selectedSizeName = name;
      let total = Number(selectedItemForModal.basePrice) + Number(offset);
      
      const isMenu = document.getElementById('make-menu-check') && document.getElementById('make-menu-check').checked;
      if (isMenu) {
        total += 60; // Menü farkı (Orta Boy Patates + Kola)
      }

      document.getElementById('modal-price').innerText = `${total} ₺`;
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.add('hidden');
      selectedItemForModal = null;
      isCampaignModal = false;
    }

    function confirmAddToCart() {
      if (!selectedItemForModal) return;
      const note = document.getElementById('modal-note').value.trim();
      const isMenu = document.getElementById('make-menu-check') && document.getElementById('make-menu-check').checked;
      
      let finalPrice = Number(selectedItemForModal.basePrice) + Number(selectedSizeOffset);
      let itemTitle = selectedItemForModal.title;
      let itemSub = selectedSizeName;

      if (isCampaignModal) {
        itemTitle = `🔥 Kampanya: ${selectedItemForModal.title}`;
        itemSub = `İçecek: ${selectedSizeName} + Patates`;
      } else if (isMenu) {
        finalPrice += 60;
        const bev = document.getElementById('menu-beverage-select').value;
        itemTitle = `${selectedItemForModal.title} (MENÜ)`;
        itemSub = `${selectedSizeName ? selectedSizeName + ' | ' : ''}Orta Boy Patates + ${bev}`;
      }

      cart.push({
        id: selectedItemForModal.id + '_' + Date.now(),
        title: itemTitle,
        price: finalPrice,
        size: itemSub,
        note: note
      });

      closeProductModal();
      updateCartBadge();
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      if (cart.length > 0) {
        badge.innerText = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function openCartModal() {
      const list = document.getElementById('cart-items-list');
      if (cart.length === 0) {
        list.innerHTML = '<div class="py-12 text-center text-slate-500 text-xs">Sepetiniz boş.</div>';
        document.getElementById('cart-total-price').innerText = '0 ₺';
        document.getElementById('cart-modal').classList.remove('hidden');
        return;
      }

      let total = 0;
      list.innerHTML = cart.map((item, idx) => {
        total += item.price;
        return `
          <div class="bg-slate-900 p-3.5 rounded-2xl border border-slate-700 flex items-center justify-between gap-3 text-xs">
            <div>
              <h4 class="font-extrabold text-white">${item.title}</h4>
              ${item.size ? `<span class="text-amber-400 font-bold text-[10px] block mt-0.5">${item.size}</span>` : ''}
              ${item.note ? `<span class="text-slate-400 italic text-[10px] block mt-0.5">Not: ${item.note}</span>` : ''}
            </div>
            <div class="flex items-center gap-3">
              <b class="text-emerald-400 font-black">${item.price} ₺</b>
              <button onclick="removeFromCart(${idx})" class="w-7 h-7 rounded-xl bg-slate-800 text-slate-400 hover:text-red-400 hover:bg-red-500/10 flex items-center justify-center transition"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cart-total-price').innerText = `${total} ₺`;
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      updateCartBadge();
      openCartModal();
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    async function submitOrder() {
      if (cart.length === 0) { alert('Sepetiniz boş!'); return; }
      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

      try {
        const res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tableName: currentTableName, items: cart, totalPrice })
        });
        const data = await res.json();
        if (data.success) {
          alert('Siparişiniz başarıyla mutfağa iletildi! Afiyet olsun.');
          cart = [];
          updateCartBadge();
          closeCartModal();
          openTrackingModal();
        } else {
          alert('Sipariş gönderilemedi.');
        }
      } catch (e) {
        alert('Sunucu bağlantı hatası.');
      }
    }

    async function openTrackingModal() {
      document.getElementById('tracking-modal').classList.remove('hidden');
      checkMyOrdersStatus();
    }

    function closeTrackingModal() {
      document.getElementById('tracking-modal').classList.add('hidden');
    }

    async function checkMyOrdersStatus() {
      try {
        const res = await fetch('/api/orders');
        const data = await res.json();
        if (data.success) {
          const myOrders = (data.orders || []).filter(o => String(o.tableName || '').toLowerCase() === currentTableName.toLowerCase());
          const list = document.getElementById('tracking-orders-list');

          if (myOrders.length === 0) {
            list.innerHTML = '<div class="py-12 text-center text-slate-500 text-xs">Bu konuma ait aktif sipariş bulunmuyor.</div>';
            return;
          }

          list.innerHTML = [...myOrders].reverse().map(o => {
            const st = String(o.status || '').toUpperCase();
            let statusText = 'Onay Bekliyor ⏳';
            let statusClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';

            if (st === 'PREPARING') {
              statusText = 'Mutfakta Hazırlanıyor 👨‍🍳';
              statusClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
            } else if (st === 'SERVED') {
              statusText = 'Servis Edildi / Hazır 🛎️';
              statusClass = 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30';
            } else if (st === 'PAID') {
              statusText = 'Ödeme Alındı & Tamamlandı ✅';
              statusClass = 'bg-slate-700 text-slate-300 border-slate-600';
            } else if (st === 'CANCELLED') {
              statusText = 'İptal Edildi ❌';
              statusClass = 'bg-red-500/20 text-red-400 border-red-500/30';
            }

            return `
              <div class="bg-slate-900 border border-slate-700 p-4 rounded-2xl space-y-3 text-xs">
                <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                  <span class="font-mono font-bold text-slate-400">Sipariş #${o.id}</span>
                  <span class="px-3 py-1 rounded-xl font-black border ${statusClass}">${statusText}</span>
                </div>
                <div class="space-y-1">
                  ${(o.items || []).map(i => `
                    <div class="flex justify-between text-slate-300">
                      <span>${i.title}${i.size ? '(' + i.size + ')' : ''}</span>
                      <b class="text-amber-400">${i.price} ₺</b>
                    </div>
                  `).join('')}
                </div>
                <div class="flex justify-between items-center pt-2 border-t border-slate-800 font-black">
                  <span class="text-slate-400">Toplam:</span>
                  <span class="text-emerald-400 text-sm">${o.totalPrice} ₺</span>
                </div>
              </div>
            `;
          }).join('');
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
